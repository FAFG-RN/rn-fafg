        color:var(--color-text);

      .title {color:#102c53!important;text-shadow:none;}
      .last-update {color:#183d64!important;text-shadow:none;}
      header {background:rgba(3,23,56,.88);backdrop-filter:blur(9px);}
      @media(max-width:700px){body, .dark body, body.dark{background-position:center;background-attachment:scroll;background-size:cover;}}
      .logos-container{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));justify-content:center;align-items:center;column-gap:22px;row-gap:20px;width:100%;max-width:1080px;margin:32px auto 28px;padding:0 24px;box-sizing:border-box}
      .logos-container picture{display:flex;align-items:center;justify-content:center;width:100%;height:148px;min-width:0}
      .logos-container .logo-img{display:block;object-fit:contain;object-position:center;margin:0;transform:none!important;max-width:100%;max-height:100%;width:auto;height:auto}
      /* Compensación óptica según el formato original de cada escudo */
      .logos-container picture:nth-child(1) .logo-img{width:174px;max-height:116px}
      .logos-container picture:nth-child(2) .logo-img{width:143px;max-height:143px}
      .logos-container picture:nth-child(3) .logo-img{width:156px;max-height:132px}
      .logos-container picture:nth-child(4) .logo-img{width:156px;max-height:132px}
      .logos-container picture:nth-child(5) .logo-img{width:145px;max-height:143px}
      /* Liga 1 y Copa Federación: +20% adicional sobre ajuste anterior (1.15 × 1.20 = 1.38) */
      .logos-container picture:nth-child(3) .logo-img,
      .logos-container picture:nth-child(5) .logo-img{transform:scale(1.38)!important;transform-origin:center center}
      @media(max-width:1000px){.logos-container{gap:14px;padding:0 18px}.logos-container picture{height:125px}.logos-container .logo-img{max-height:125px!important}}
      @media(max-width:600px){.logos-container{grid-template-columns:repeat(3,minmax(0,1fr));justify-items:center;column-gap:12px;row-gap:12px;margin:22px auto;padding:0 14px}.logos-container picture{height:100px}.logos-container .logo-img{max-width:100%!important;max-height:100px!important}.logos-container picture:nth-child(4){grid-column:1}.logos-container picture:nth-child(5){grid-column:3}}

    <title>Ranking Nacional Footgolf</title>
  </head>
  <body>
    <header>
      <app-search></app-search>
      <app-theme-mode></app-theme-mode>
    </header>

    <div class="logos-container">
      <picture>
        <img loading="lazy" src="assets/images/FAFG-Horizontal.png" alt="Federación Argentina de FootGolf" class="logo-img" />
      </picture>
      <picture>
        <img loading="lazy" src="assets/images/CDR%202.png" alt="Copa de la República FAFG" class="logo-img" />
      </picture>
      <picture>
        <source srcset="assets/images/logo-liga1.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo-liga1.png"
          alt="logo"
          class="logo-img"
        />
      </picture>
      <picture>
        <source srcset="assets/images/logo-ln.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo-ln.png"
          alt="logo"
          class="logo-img"
        />
      </picture>
      <picture>
        <img
          loading="lazy"
          src="assets/images/copa%20federacion.png"
          alt="Copa Federación FAFG"
          class="logo-img"
          style="object-fit:contain"
        />
      </picture>
    </div>

    <h1 class="title">RANKING NACIONAL</h1>


    <div style="text-align:center;margin:16px auto 24px;padding:0 16px"><a href="./categorias.html" style="display:inline-block;background:#235f89;color:#fff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:10px">Ver ranking 2026 por categorías →</a></div>
    <div class="last-update"></div>
    <div class="switch-view-container">
      <div class="switch-view-wrapper">
        <app-switch-view></app-switch-view>
      </div>
    </div>
    <!-- The list or table loads dynamically - By default shows the list -->
    <div class="container">
      <app-ranking></app-ranking>
    </div>
  </body>
