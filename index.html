      .title {color:#fff!important;text-shadow:0 2px 12px #00183b;}
      .last-update {color:#fff!important;text-shadow:0 1px 4px #00183b;}
      header {background:rgba(3,23,56,.88);backdrop-filter:blur(9px);}
      @media(max-width:700px){body, .dark body, body.dark{background-position:center;background-attachment:scroll;background-size:cover;}}
      .logos-container{display:grid;grid-template-columns:repeat(5,160px);justify-content:center;align-items:center;column-gap:30px;row-gap:20px;width:100%;max-width:1100px;margin:32px auto 28px;padding:0 20px;box-sizing:border-box}
      .logos-container picture{display:flex;align-items:center;justify-content:center;width:160px;height:150px;min-width:0}
      .logos-container .logo-img{display:block;width:100%;height:100%;max-width:160px;max-height:150px;object-fit:contain;object-position:center;margin:0}
      /* Equilibrio visual de escudos con márgenes internos en sus archivos */
      .logos-container picture:nth-child(2) .logo-img{transform:scale(1.25)}
      .logos-container picture:nth-child(3) .logo-img{transform:scale(1.22)}
      .logos-container picture:nth-child(4) .logo-img{transform:scale(1.18)}
      .logos-container picture:nth-child(5) .logo-img{transform:scale(1.30)}
      .logos-container picture:nth-child(5) .logo-img{transform:scale(1.28);transform-origin:center center}
      @media(max-width:1000px){.logos-container{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;max-width:850px}.logos-container picture{width:100%;height:125px}.logos-container .logo-img{max-width:100%;max-height:125px}}
      @media(max-width:600px){.logos-container{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:22px auto;padding:0 16px}.logos-container picture{flex:0 0 calc((100% - 32px)/3);width:calc((100% - 32px)/3);height:100px}.logos-container .logo-img{max-height:100px}}

    <title>Ranking Nacional Footgolf</title>

  <body>
    <header>
      <app-search></app-search>
      <app-theme-mode></app-theme-mode>
    </header>

    <div class="logos-container">
      <picture>
        <source srcset="assets/images/logo.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo.png"
          alt="logo"
          class="logo-img logo-filtered-blue"
        />
      </picture>
      <picture>
        <source
          srcset="assets/images/logo-copa-republica.webp"
          type="image/webp"
        />
        <img
          loading="lazy"
          src="assets/images/logo-copa-republica.png"
          alt="logo"
          class="logo-img logo-filtered-black"
        />
      </picture>
      <picture>
        <source srcset="assets/images/logo-liga1.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo-liga1.png"
          alt="logo"
          class="logo-img"
        />
      </picture>
      <picture>
        <source srcset="assets/images/logo-ln.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo-ln.png"
          alt="logo"
          class="logo-img"
        />
      </picture>
      <picture>
        <img
          loading="lazy"
          src="assets/images/copa%20federacion.png"
          alt="Copa Federación FAFG"
          class="logo-img"
          style="object-fit:contain"
        />
      </picture>
    </div>

    <h1 class="title">RANKING NACIONAL</h1>


    <div style="text-align:center;margin:16px auto 24px;padding:0 16px"><a href="./categorias.html" style="display:inline-block;background:#235f89;color:#fff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:10px">Ver ranking 2026 por categorías →</a></div>
    <div class="last-update"></div>
    <div class="switch-view-container">
      <div class="switch-view-wrapper">
        <app-switch-view></app-switch-view>
      </div>
    </div>
    <!-- The list or table loads dynamically - By default shows the list -->
    <div class="container">
      <app-ranking></app-ranking>
    </div>
  </body>
