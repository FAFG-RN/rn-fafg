<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ranking Nacional de Footgolf" />
    <meta name="theme-color" content="#316d93" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Footgolf" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/base.css?v=1.3" />
    <link rel="stylesheet" href="./css/responsive.css?v=1.3" />
    <style>
      .logos-container{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:clamp(12px,2.4vw,32px);max-width:1120px;margin:30px auto 26px;padding:0 20px}
      .logos-container picture{width:clamp(110px,15vw,180px);height:clamp(110px,15vw,180px);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
      .logos-container .logo-img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;margin:auto}
      @media(max-width:600px){.logos-container{gap:12px;margin:20px auto}.logos-container picture{width:calc((100vw - 80px)/3);height:calc((100vw - 80px)/3);max-width:125px;max-height:125px}}
    </style>

    <title>Ranking Nacional Footgolf</title>
  </head>
  <body>
    <header>
      <app-search></app-search>
      <app-theme-mode></app-theme-mode>
    </header>

    <div class="logos-container">
      <picture>
        <source srcset="assets/images/logo.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo.png"
          alt="logo"
          class="logo-img logo-filtered-blue"
        />
      </picture>
      <picture>
        <source
          srcset="assets/images/logo-copa-republica.webp"
          type="image/webp"
        />
        <img
          loading="lazy"
          src="assets/images/logo-copa-republica.png"
          alt="logo"
          class="logo-img logo-filtered-black"
        />
      </picture>
      <picture>
        <source srcset="assets/images/logo-liga1.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo-liga1.png"
          alt="logo"
          class="logo-img"
        />
      </picture>
      <picture>
        <source srcset="assets/images/logo-ln.webp" type="image/webp" />
        <img
          loading="lazy"
          src="assets/images/logo-ln.png"
          alt="logo"
          class="logo-img"
        />
      </picture>
      <picture>
        <img
          loading="lazy"
          src="assets/images/copa%20federacion.jpeg"
          alt="Copa Federación FAFG"
          class="logo-img"
          style="object-fit:contain"
        />
      </picture>
    </div>

    <h1 class="title">RANKING NACIONAL</h1>


    <div style="text-align:center;margin:16px auto 24px;padding:0 16px"><a href="./categorias.html" style="display:inline-block;background:#235f89;color:#fff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:10px">Ver ranking 2026 por categorías →</a></div>
    <div class="last-update"></div>
    <div class="switch-view-container">
      <div class="switch-view-wrapper">
        <app-switch-view></app-switch-view>
      </div>
    </div>
    <!-- The list or table loads dynamically - By default shows the list -->
    <div class="container">
      <app-ranking></app-ranking>
    </div>
  </body>
  <script type="module" src="./js/main.js?v=1.3"></script>
</html>
