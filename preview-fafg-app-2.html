<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FAFG APP 2.0 · Vista previa</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f0f7;color:#112c4d;font-family:system-ui,-apple-system,sans-serif}.phone{max-width:450px;min-height:100dvh;margin:auto;background:#f8fbff;padding-bottom:96px}.hero{position:relative;min-height:270px;padding:35px 24px 30px;display:flex;flex-direction:column;justify-content:end;color:white;overflow:hidden;background:linear-gradient(180deg,#071d38aa,#06274de8),url('./assets/images/2930250d-2805-474f-9f84-7a9cc2c59207.jpeg') center/cover}.hero:after{content:'';position:absolute;right:-45px;top:-45px;width:190px;height:190px;border:1px solid #ffffff44;border-radius:50%}.hero img{width:195px;max-height:75px;object-fit:contain;object-position:left;margin-bottom:25px;filter:drop-shadow(0 4px 8px #0006)}.eyebrow{font-size:11px;letter-spacing:.22em;color:#b5dcff;font-weight:750}.hero h1{font-size:28px;margin:8px 0 5px;letter-spacing:.03em}.hero p{margin:0;color:#d9ebff;font-size:14px}.body{padding:23px 18px;animation:enter .32s ease both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.title{font-size:13px;font-weight:800;letter-spacing:.12em;color:#31648f;margin:4px 4px 15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #dce8f4;border-radius:18px;background:white;box-shadow:0 5px 18px #173b5d0b;padding:18px;min-height:108px}.card b{display:block;font-size:18px;margin:7px 0}.card small{font-size:12px;color:#607c96}.card.wide{grid-column:span 2;min-height:90px}.metric{font-size:29px;font-weight:850;color:#0d5595}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(450px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:white;box-shadow:0 -6px 24px #0c2e521a;padding:10px 3px max(12px,env(safe-area-inset-bottom));z-index:3}.nav button{border:0;background:none;color:#647c94;font-size:11px;padding:7px 1px;cursor:pointer}.nav button.active{color:#075c9e;font-weight:800}.nav button span{display:block;font-size:22px;margin-bottom:5px}.nav button[data-id="perfil"]{position:relative;margin-top:-31px;align-self:start;z-index:5;color:#075c9e;font-weight:800}.nav button[data-id="perfil"] span{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#0c74b9,#092d61);border:5px solid #fff;box-shadow:0 5px 18px #0b376055;display:grid;place-items:center;margin:0 auto 2px;color:#fff;font-size:30px}.nav button[data-id="perfil"].active span{background:linear-gradient(145deg,#1c9be1,#07508e);box-shadow:0 4px 22px #137bc277}.nav button[data-id="perfil"]{font-size:0}.nav button[data-id="perfil"] span{font-size:30px}.nav{overflow:visible}.pill{background:#eaf3fb;border-radius:20px;padding:7px 11px;font-size:11px;color:#28628f}.notice{text-align:center;font-size:11px;color:#7890a6;padding:12px}</style></head><body><main class="phone"><header class="hero"><img src="./assets/images/FAFG-Horizontal-2.png" alt="FAFG"><div class="eyebrow" id="eyebrow">BIENVENIDO A FAFG</div><h1 id="heading">TU FOOTGOLF</h1><p id="subtitle">Todo en un solo lugar</p></header><section class="body" id="body"></section><div class="notice">VISTA PREVIA · SIN CAMBIOS EN LA APP OFICIAL</div></main><nav class="nav" id="nav"></nav><script>const data=[{id:'inicio',icon:'⌂',label:'Inicio',eyebrow:'BIENVENIDO A FAFG',title:'TU FOOTGOLF',subtitle:'Todo en un solo lugar',html:'<div class="title">TU EXPERIENCIA DEPORTIVA</div><div class="cards"><div class="card"><small>PRÓXIMO TORNEO</small><b>Copa de la República</b><small>6–8 diciembre</small></div><div class="card"><small>RANKING</small><b>Ranking Nacional</b><small>Ver categorías</small></div><div class="card wide"><small>ACCESO RÁPIDO</small><b>Tarjeta digital de juego</b><small>Jugá, registrá y compartí tu ronda</small></div></div>'},{id:'noticias',icon:'▤',label:'Noticias',eyebrow:'COMUNIDAD FAFG',title:'ACTUALIDAD',subtitle:'Las novedades del FootGolf argentino',html:'<div class="title">ÚLTIMAS NOVEDADES</div><div class="cards"><div class="card wide"><small>TORNEOS</small><b>Copa de la República</b><small>Inscripciones y novedades</small></div><div class="card wide"><small>ASOCIACIONES</small><b>Noticias de las regiones</b><small>Una comunidad en movimiento</small></div></div>'},{id:'ranking',icon:'♜',label:'Ranking',eyebrow:'COMPETENCIA NACIONAL',title:'RANKING FAFG',subtitle:'Tu posición. Tu progreso.',html:'<div class="title">ESTADÍSTICAS EN VIVO · DEMOSTRACIÓN</div><div class="cards"><div class="card"><small>POSICIÓN</small><div class="metric">—</div><small>Según categoría</small></div><div class="card"><small>PUNTOS</small><div class="metric">—</div><small>Ranking nacional</small></div><div class="card wide"><b>Rumbo a Copa Federación</b><small>Consulta de puntos y posiciones</small></div></div>'},{id:'perfil',icon:'◉',label:'Perfil',eyebrow:'TU HISTORIA DEPORTIVA',title:'MI CARRERA',subtitle:'Cada torneo cuenta',html:'<div class="title">PERFIL DEL JUGADOR</div><div class="cards"><div class="card wide"><b>Tu credencial FAFG</b><small>Foto, datos y estado de socio</small></div><div class="card"><small>TORNEOS</small><div class="metric">—</div></div><div class="card"><small>HANDICAP</small><div class="metric">—</div></div></div>'},{id:'ayuda',icon:'?',label:'Ayuda',eyebrow:'ESTAMOS PARA AYUDARTE',title:'CENTRO DE AYUDA',subtitle:'Todo lo que necesitás saber',html:'<div class="title">GUÍA RÁPIDA</div><div class="cards"><div class="card wide"><b>Cómo usar tu tarjeta digital</b><small>Configuración y carga de golpes</small></div><div class="card wide"><b>Cómo consultar tu ranking</b><small>Categorías y puntos</small></div></div>'}];function show(id){const d=data.find(x=>x.id===id);document.getElementById('eyebrow').textContent=d.eyebrow;document.getElementById('heading').textContent=d.title;document.getElementById('subtitle').textContent=d.subtitle;const b=document.getElementById('body');b.innerHTML=d.html;b.style.animation='none';void b.offsetWidth;b.style.animation='enter .32s ease both';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id))}document.getElementById('nav').innerHTML=[data[0],data[1],data[3],data[2],data[4]].map(d=>'<button data-id="'+d.id+'"><span>'+d.icon+'</span>'+d.label+'</button>').join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.id));show('inicio');</script></body></html>
