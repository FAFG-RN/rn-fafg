<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAFG | Administración</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f7fb;color:#173d5f}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:auto;min-height:100vh;padding-bottom:30px}header{background:linear-gradient(130deg,#102c53,#176a9c);color:white;padding:26px 22px;border-radius:0 0 24px 24px}header a{color:#dceef9;text-decoration:none;font-size:13px}h1{margin:16px 0 5px;font-size:26px}header p{color:#dceef9;margin:0}main{padding:20px 16px}.card{background:white;border:1px solid #dce7f0;border-radius:16px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{text-align:left;font:inherit;color:#173d5f;cursor:pointer}.tile strong{display:block;margin:8px 0 5px}.tile small{color:#617487;line-height:1.4}.muted{color:#617487}.back{border:0;background:#e8f2f9;color:#164e73;border-radius:9px;padding:10px 14px;cursor:pointer}.hidden{display:none}.status{font-size:14px}</style></head>
<body><div class="shell"><header><a href="./app.html">← Volver a FAFG App</a><h1>Panel de administración</h1><p>Gestión de competencias oficiales</p></header><main><div id="status" class="card status" role="status">Verificando acceso…</div><div id="panel" class="hidden"><p class="muted">Administrador FAFG · Espacio de gestión</p><div id="home" class="grid"></div><section id="detail" class="hidden"><button class="back" id="back">← Volver al panel</button><div class="card" style="margin-top:14px"><h2 id="detail-title"></h2><p id="detail-description" class="muted"></p><p class="muted">Módulo pendiente de implementación. No se modificaron datos oficiales.</p></div></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase?.createClient('https://kkrzqxiomkorxyjlnjqc.supabase.co','sb_publishable_9BJJ0ZYFX1B6hkmG-wUbhg_llNAeGc5',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'fafg-app-auth'}});
const status=document.getElementById('status'),panel=document.getElementById('panel');
const modules=[['🏆','Torneos','Crear y administrar competencias'],['👥','Inscripciones','Jugadores, categorías y pagos'],['⛳','Canchas','Recorridos y par de 18 hoyos'],['📋','Líneas de salida','Sorteos, grupos y horarios'],['🔴','Live Score','Seguimiento de las rondas'],['✅','Resultados oficiales','Validar tarjetas y publicar']];
async function verify(){if(!client){status.textContent='No se pudo conectar con Supabase.';return}const {data:{user},error}=await client.auth.getUser();if(error||!user){status.textContent='Iniciá sesión desde Mi perfil en la app para acceder.';return}const result=await client.rpc('is_fafg_admin');if(result.error){status.textContent='Acceso administrativo pendiente de configurar en Supabase.';return}if(result.data!==true){status.textContent='Esta cuenta no tiene permisos de administración.';return}status.classList.add('hidden');panel.classList.remove('hidden');}
const home=document.getElementById('home'),detail=document.getElementById('detail');
modules.forEach(([icon,title,description])=>{const button=document.createElement('button');button.type='button';button.className='card tile';const i=document.createElement('span');i.textContent=icon;const h=document.createElement('strong');h.textContent=title;const d=document.createElement('small');d.textContent=description;button.append(i,h,d);button.onclick=()=>{document.getElementById('detail-title').textContent=title;document.getElementById('detail-description').textContent=description;home.classList.add('hidden');detail.classList.remove('hidden')};home.append(button)});
document.getElementById('back').onclick=()=>{detail.classList.add('hidden');home.classList.remove('hidden')};verify();
</script></body></html>
