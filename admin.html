<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAFG | Administración</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f7fb;color:#173d5f}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:auto;min-height:100vh;padding-bottom:30px}header{background:linear-gradient(130deg,#102c53,#176a9c);color:white;padding:26px 22px;border-radius:0 0 24px 24px}header a{color:#dceef9;text-decoration:none;font-size:13px}h1{margin:16px 0 5px;font-size:26px}header p{color:#dceef9;margin:0}main{padding:20px 16px}.card{background:white;border:1px solid #dce7f0;border-radius:16px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{text-align:left;font:inherit;color:#173d5f;cursor:pointer}.tile strong{display:block;margin:8px 0 5px}.tile small{color:#617487;line-height:1.4}.muted{color:#617487}.back{border:0;background:#e8f2f9;color:#164e73;border-radius:9px;padding:10px 14px;cursor:pointer}.hidden{display:none}input,select{width:100%;padding:11px;border:1px solid #cbdce9;border-radius:9px;font:inherit;margin:5px 0 12px;background:white;color:#173d5f}label{font-size:13px;font-weight:600}.primary{border:0;background:#176a9c;color:white;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}.item{padding:12px;border:1px solid #dce7f0;border-radius:10px;margin:8px 0}.item small{display:block;color:#617487;margin-top:5px}.error{color:#ad2638}.hidden{display:none}.status{font-size:14px}</style></head>
<body><div class="shell"><header><a href="./app.html">← Volver a FAFG App</a><h1>Panel de administración</h1><p>Gestión de competencias oficiales</p></header><main><div id="status" class="card status" role="status">Verificando acceso…</div><div id="panel" class="hidden"><p class="muted">Administrador FAFG · Espacio de gestión</p><div id="home" class="grid"><a class="card tile" href="comercial.html"><strong>🤝 Beneficios y panel comercial</strong><small>Comercios, sponsors, aportes y jugadores por ciudad</small></a></div><section id="detail" class="hidden"><button class="back" id="back">← Volver al panel</button><div class="card" style="margin-top:14px"><h2 id="detail-title"></h2><p id="detail-description" class="muted"></p><div id="module-content"><p class="muted">Módulo pendiente de implementación. No se modificaron datos oficiales.</p></div></div></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase?.createClient('https://kkrzqxiomkorxyjlnjqc.supabase.co','sb_publishable_9BJJ0ZYFX1B6hkmG-wUbhg_llNAeGc5',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'fafg-app-auth'}});
const status=document.getElementById('status'),panel=document.getElementById('panel');
const modules=[['🏆','Torneos','Crear y administrar competencias'],['👥','Inscripciones','Jugadores, categorías y pagos'],['⛳','Canchas','Recorridos y par de 18 hoyos'],['📋','Líneas de salida','Sorteos, grupos y horarios'],['🔴','Live Score','Seguimiento de las rondas'],['✅','Resultados oficiales','Validar tarjetas y publicar']];
async function verify(){if(!client){status.textContent='No se pudo conectar con Supabase.';return}const {data:{user},error}=await client.auth.getUser();if(error||!user){status.textContent='Iniciá sesión desde Mi perfil en la app para acceder.';return}const result=await client.rpc('is_fafg_admin');if(result.error){status.textContent='Acceso administrativo pendiente de configurar en Supabase.';return}if(result.data!==true){status.textContent='Esta cuenta no tiene permisos de administración.';return}status.classList.add('hidden');panel.classList.remove('hidden');}
const home=document.getElementById('home'),detail=document.getElementById('detail');
const moduleContent=document.getElementById('module-content');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadModule(title){
 if(title==='Torneos'){
 moduleContent.innerHTML='<p class="muted">Los cambios se guardan en Supabase. Los torneos en borrador no deben publicarse en el calendario público.</p><form id="tournament-form"><input type="hidden" name="id" value=""><label>Competencia<select name="competencia"><option>Liga 1</option><option>Liga Nacional</option><option>Copa de la República</option><option>Copa Federación</option></select></label><label>Nombre del torneo<input name="nombre" required minlength="2" maxlength="160" placeholder="Ej. Copa de la República 2026"></label><label>Fecha de inicio<input name="fecha_inicio" type="date" required></label><label>Fecha de finalización<input name="fecha_fin" type="date" required></label><label>Sede<input name="sede" maxlength="160" placeholder="Club y localidad"></label><label>Modalidad<select name="modalidad"><option value="shotgun">Shotgun</option><option value="tee_time">Tee Time</option></select></label><label>Cantidad de rondas de 18 hoyos<input name="rondas" type="number" min="1" max="6" value="3" required></label><label>Estado<select name="estado"><option value="borrador">Borrador</option><option value="inscripciones">Inscripciones abiertas</option><option value="en_juego">En juego</option><option value="finalizado">Finalizado</option></select></label><button class="primary" type="submit">Guardar torneo</button><button type="button" class="back" id="tournament-cancel" style="margin-left:8px">Cancelar edición</button><p id="form-status" role="status"></p></form><h3>Torneos registrados</h3><div id="tournament-list">Cargando…</div>';
 document.getElementById('tournament-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));const editId=data.id;delete data.id;data.rondas=Number(data.rondas);const msg=document.getElementById('form-status');if(data.fecha_fin<data.fecha_inicio){msg.textContent='La fecha final no puede ser anterior a la inicial.';return}const {error}=editId?await client.from('fafg_torneos').update(data).eq('id',editId):await client.from('fafg_torneos').insert(data);msg.textContent=error?'No se pudo guardar: '+error.message:'Torneo guardado correctamente.';msg.className=error?'error':'';if(!error){form.reset();loadTournaments()}};document.getElementById('tournament-cancel').onclick=()=>{const f=document.getElementById('tournament-form');f.reset();f.elements.id.value='';document.getElementById('form-status').textContent='Edición cancelada.'};
 await loadTournaments();return;
 }
 if(title==='Canchas'){
 moduleContent.innerHTML='<form id="course-form"><label>Nombre de la cancha<input name="nombre" required minlength="2" maxlength="120" placeholder="Ej. Bragado Golf Club"></label><label>Localidad<input name="localidad" maxlength="120"></label><label>Provincia<input name="provincia" maxlength="120"></label><button class="primary" type="submit">Guardar cancha</button><p id="course-status" role="status"></p></form><h3>Biblioteca de canchas</h3><div id="course-list">Cargando…</div><h3>Recorridos de 18 hoyos</h3><form id="layout-form"><label>Cancha<select name="cancha_id" id="layout-course" required><option value="">Seleccionar cancha</option></select></label><label>Nombre del recorrido<input name="nombre" required minlength="2" maxlength="120" placeholder="Ej. Recorrido principal"></label><div id="holes-grid" class="grid"></div><p id="par-total" class="muted">Par total: 72</p><button class="primary" type="submit">Guardar recorrido</button><p id="layout-status" role="status"></p></form><div id="layout-list"></div>';
 document.getElementById('course-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,data=Object.fromEntries(new FormData(form));const {data:created,error}=await client.from('fafg_canchas').insert(data).select('id').single();document.getElementById('course-status').textContent=error?'No se pudo guardar: '+error.message:'Cancha guardada.';if(!error){form.reset();await loadCourses();document.getElementById('layout-course').value=created.id;document.getElementById('layout-form').scrollIntoView({behavior:'smooth',block:'start'})}};
 await loadCourses();
 const holes=document.getElementById('holes-grid');
 for(let i=1;i<=18;i++){const wrap=document.createElement('label');wrap.textContent='Hoyo '+i;const input=document.createElement('input');input.type='number';input.min='2';input.max='7';input.required=true;input.value='4';input.name='par_'+i;input.addEventListener('input',updatePar);wrap.append(input);holes.append(wrap)}
 function updatePar(){const values=[...holes.querySelectorAll('input')].map(x=>Number(x.value));document.getElementById('par-total').textContent=values.every(v=>v>=2&&v<=7)?'Par total: '+values.reduce((a,b)=>a+b,0):'Revisá los pares de los 18 hoyos'}
 updatePar();
 document.getElementById('layout-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const pars=Array.from({length:18},(_,i)=>Number(form.elements['par_'+(i+1)].value));const msg=document.getElementById('layout-status');if(pars.some(v=>!Number.isInteger(v)||v<2||v>7)){msg.textContent='Cada hoyo debe tener un par válido entre 2 y 7.';return}const payload={cancha_id:form.elements.cancha_id.value,nombre:form.elements.nombre.value,pares:pars};const editId=form.dataset.editId;const {error}=editId?await client.from('fafg_recorridos').update(payload).eq('id',editId):await client.from('fafg_recorridos').insert(payload);msg.textContent=error?'No se pudo guardar: '+error.message:'Recorrido de 18 hoyos guardado.';if(!error){form.elements.nombre.value='';delete form.dataset.editId;form.querySelector('button[type=submit]').textContent='Guardar recorrido';loadLayouts()}};
 await loadLayouts();return;
 }
 moduleContent.innerHTML='<p class="muted">Módulo en preparación. Todavía no modifica datos oficiales.</p>';
}
async function loadTournaments(){const list=document.getElementById('tournament-list');if(!list)return;const {data,error}=await client.from('fafg_torneos').select('id,nombre,competencia,fecha_inicio,fecha_fin,sede,modalidad,rondas,estado').order('fecha_inicio',{ascending:false}).limit(100);list.replaceChildren();if(error){list.textContent='No se pudieron cargar torneos: '+error.message;return}if(!data.length){list.textContent='Todavía no hay torneos registrados.';return}for(const t of data){const item=document.createElement('div');item.className='item';const name=document.createElement('strong');name.textContent=t.nombre;const meta=document.createElement('small');meta.textContent=[t.competencia,t.fecha_inicio+' al '+t.fecha_fin,t.sede||'Sede pendiente',t.estado].join(' · ');const btn=document.createElement('button');btn.type='button';btn.className='back';btn.style.marginTop='10px';btn.textContent='Editar torneo';btn.onclick=()=>{const form=document.getElementById('tournament-form');for(const key of ['id','nombre','competencia','fecha_inicio','fecha_fin','sede','modalidad','rondas','estado'])if(form.elements[key])form.elements[key].value=t[key]??'';document.getElementById('form-status').textContent='Editando: '+t.nombre;form.scrollIntoView({behavior:'smooth',block:'start'})};item.append(name,meta,btn);list.append(item)}}
async function loadLayouts(){
 const list=document.getElementById('layout-list');if(!list)return;
 const {data,error}=await client.from('fafg_recorridos').select('id,cancha_id,nombre,pares,fafg_canchas(nombre)').order('nombre').limit(100);
 list.replaceChildren();
 if(error){list.textContent='No se pudieron cargar los recorridos: '+error.message;return}
 if(!data.length){list.textContent='Todavía no hay recorridos cargados.';return}
 const h=document.createElement('h3');h.textContent='Recorridos guardados';list.append(h);
 for(const x of data){
  const item=document.createElement('div');item.className='item';
  const title=document.createElement('strong');title.textContent=x.nombre;
  const detail=document.createElement('small');detail.textContent=(x.fafg_canchas?.nombre||'Cancha')+' · 18 hoyos · Par '+x.pares.reduce((a,b)=>a+b,0);
  const btn=document.createElement('button');btn.type='button';btn.className='back';btn.style.marginTop='10px';btn.textContent='Editar pares';
  btn.onclick=()=>{const form=document.getElementById('layout-form');form.dataset.editId=x.id;form.elements.cancha_id.value=x.cancha_id;form.elements.nombre.value=x.nombre;x.pares.forEach((v,i)=>{form.elements['par_'+(i+1)].value=v});form.querySelector('button[type=submit]').textContent='Guardar cambios';document.getElementById('par-total').textContent='Par total: '+x.pares.reduce((a,b)=>a+b,0);form.scrollIntoView({behavior:'smooth',block:'start'})};
  item.append(title,detail,btn);list.append(item);
 }
}
async function loadCourses(){const list=document.getElementById('course-list');if(!list)return;const {data,error}=await client.from('fafg_canchas').select('id,nombre,localidad,provincia').order('nombre').limit(100);const select=document.getElementById('layout-course');if(select&&!error){const selected=select.value;select.replaceChildren(new Option('Seleccionar cancha',''));data.forEach(c=>select.add(new Option(c.nombre+' · '+c.localidad,c.id)));select.value=selected}list.innerHTML=error?'<p class="error">Falta configurar la biblioteca en Supabase.</p>':data.length?data.map(c=>'<div class="item"><strong>'+safe(c.nombre)+'</strong><small>'+safe(c.localidad)+' · '+safe(c.provincia)+'</small></div>').join(''):'<p class="muted">Todavía no hay canchas registradas.</p>'}

modules.forEach(([icon,title,description])=>{const button=document.createElement('button');button.type='button';button.className='card tile';const i=document.createElement('span');i.textContent=icon;const h=document.createElement('strong');h.textContent=title;const d=document.createElement('small');d.textContent=description;button.append(i,h,d);button.onclick=()=>{document.getElementById('detail-title').textContent=title;document.getElementById('detail-description').textContent=description;home.classList.add('hidden');detail.classList.remove('hidden');loadModule(title)};home.append(button)});
document.getElementById('back').onclick=()=>{detail.classList.add('hidden');home.classList.remove('hidden')};verify();
</script></body></html>
